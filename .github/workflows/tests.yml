name: tests
on:
  push:
    branches: [main]
    paths-ignore: ["config/**", "**.md"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", allow-prereleases: true, cache: pip}
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: cd tests && python -m unittest discover -v
      - run: python -m unittest discover -s tests/hunter
