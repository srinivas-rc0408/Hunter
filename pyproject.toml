[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "1.9.2"
description = "Find every relevant job early (private + Karnataka govt), rank it, fill applications, track everything."
requires-python = ">=3.10"
dependencies = [
  "python-jobspy>=1.1.80",
  "playwright>=1.45",
  "PyYAML>=6",
  "requests>=2.31",
  "rich>=13",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pdfplumber>=0.11",
  "reportlab>=4",
  "pypdf>=4",
  "openpyxl>=3.1",
]

[project.scripts]
hunt = "jobhunter.cli:main"

[tool.setuptools]
packages = ["jobhunter", "jobhunter.sources", "jobhunter.apply"]
