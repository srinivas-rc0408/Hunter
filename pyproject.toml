[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunter"
version = "2.5.0"
description = "Find every relevant job early (private + Karnataka govt), rank it, fill applications, track everything."
requires-python = ">=3.12"
dependencies = [
  "python-jobspy==1.4.1",
  "playwright==1.65.2",
  "PyYAML==6.0.3",
  "requests==2.34.2",
  "rich==15.0.0",
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "pdfplumber==0.11.10",
  "reportlab==5.1.0",
  "pypdf==7.1.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
ml = ["torch==2.15.0", "sentence-transformers==6.3.0"]

[project.scripts]
hunt = "jobhunter.cli:main"

[tool.setuptools]
packages = ["jobhunter", "jobhunter.sources", "jobhunter.apply"]

[tool.setuptools.package-data]
jobhunter = ["certs/*.pem"]
