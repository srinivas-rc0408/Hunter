# ── What you want ───────────────────────────────────────────────────────────
targets:
  roles:                             # priority order: drives title scoring
    - AI/ML Engineer
    - Machine Learning Engineer
    - AI Engineer
    - Data Scientist
    - Software Engineer
    - SDE
    - MLOps Engineer
    - Research Engineer
    - Data Analyst
  job_types: [internship, fulltime]  # internship now, full-time for 2027
  karnataka_only: true               # your rule: Karnataka locations only
  remote_ok: true                    # remote-India roles can be done from Karnataka
  # Stipend floor (decided for you): Bengaluru AI/ML interns usually get
  # ₹20k–₹50k/month. Below ₹15k is mostly unpaid "certificate" internships,
  # so those are dropped. Unlisted stipends are kept, since most posts hide pay.
  min_stipend_inr_month: 15000
  good_stipend_inr_month: 30000      # ranked higher at or above this
  min_ctc_inr_year: 600000           # your floor: 6 LPA (govt posts exempt)
  good_ctc_inr_year: 800000          # your target: 8+ LPA ranks higher
  earliest_start: 2026-11-17         # available from this week
  exclude_title_words: [senior, "sr.", "sr ", staff, principal, lead, manager, director, head,
                        architect, "vp", "10+", "5+ years", "sales", "marketing", "bpo",
                        "telecaller", "voice process", "field executive"]
  exclude_companies: []
  max_years_experience_required: 1   # postings asking 2+ years are dropped
  max_posting_age_days: 45           # older private postings are dropped (usually filled); govt exempt

