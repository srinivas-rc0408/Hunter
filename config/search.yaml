# What to scan, how often, and how picky to be.

country: India
default_location: "Bengaluru, Karnataka, India"

# Each query runs on every enabled board for each location. Keep queries tight:
# boards cap results per search, and broad queries bury good roles.
queries:
  - {term: "machine learning engineer", job_type: fulltime}
  - {term: "AI engineer", job_type: fulltime}
  - {term: "generative AI engineer", job_type: fulltime}
  - {term: "data scientist fresher", job_type: fulltime}
  - {term: "software engineer fresher", job_type: fulltime}
  - {term: "graduate engineer trainee", job_type: fulltime}
  - {term: "machine learning intern", job_type: internship}
  - {term: "AI intern", job_type: internship}
  - {term: "data science intern", job_type: internship}
  - {term: "software engineer intern", job_type: internship}
  - {term: "python developer intern", job_type: internship}
  # v2.4: the rest of the resume stack (GenAI/RAG, LangGraph, FastAPI, CV) as fresher/intern searches.
  # Internship terms carry job_type internship (LinkedIn/Indeed filter on it); fresher terms say "fresher" for Naukri.
  # No "Senior/Lead/Architect" terms: score.py drops those titles anyway. Light scans take only the first 8.
  - {term: "GenAI intern", job_type: internship}
  - {term: "SDE intern", job_type: internship}
  - {term: "LLM engineer fresher", job_type: fulltime}
  - {term: "computer vision engineer fresher", job_type: fulltime}
  - {term: "FastAPI developer", job_type: fulltime}
  - {term: "RAG developer", job_type: fulltime}
  - {term: "Aditya Birla", job_type: null}      # dream company sweep
  - {term: "Birlasoft", job_type: null}         # dream company sweep

# Karnataka only (your rule). "Remote" results are kept only if remote-in-India.
locations:
  - "Bengaluru, Karnataka, India"
  - "Mysuru, Karnataka, India"
  - "Mangaluru, Karnataka, India"
  - "Hubballi, Karnataka, India"
  - "Karnataka, India"

# Accepted location words (lower-case). A job must match one, or be remote-India.
karnataka_places: [karnataka, bengaluru, bangalore, "bengaluru urban", "bengaluru rural",
  whitefield, "electronic city", koramangala, "hsr layout", marathahalli, "outer ring road",
  hebbal, yelahanka, "manyata", "bellandur", "sarjapur", jayanagar, "jp nagar", indiranagar,
  "rajajinagar", "peenya", "devanahalli", mysuru, mysore, mangaluru, mangalore, udupi, manipal,
  hubballi, hubli, dharwad, belagavi, belgaum, kalaburagi, gulbarga, shivamogga, shimoga,
  tumakuru, tumkur, davanagere, ballari, bellary, hassan, mandya, chikkamagaluru, karwar,
  bidar, raichur, vijayapura, bijapur, bagalkot, chitradurga, kolar, ramanagara, hosur]
# hosur is Tamil Nadu but on Bengaluru's border; delete it if you want strict Karnataka.

boards:
  linkedin:  {enabled: true,  results: 40, fetch_description: false, max_searches: 6, max_descriptions: 10}   # logged-out guest search; never touches your account. Job pages read only for new jobs that pass the filters, ≤10 a search
  indeed:    {enabled: true,  results: 40}
  naukri:    {enabled: false, results: 40, skipped: blocked}   # 406 "recaptcha required" on every search since 26 Nov 2026: its jobs come from Naukri's alert emails instead (mail.py)
  glassdoor: {enabled: false, results: 20}   # blocks most cloud IPs; enable on laptop if you like
  google:    {enabled: false, results: 20}   # off: Google Jobs now needs JavaScript; jobspy 1.4.1 and 1.5.0 both return 0. It re-lists LinkedIn/Naukri/Indeed, scanned above

hours_old: 48         # normal scans look back 2 days; dedupe stops repeats
proxies: []           # optional: ["user:pass@host:port"] if LinkedIn starts returning 429
pause_between_queries_sec: 3

# Light scans (GitHub Actions every 30 min) use a subset so each run is quick
# and LinkedIn doesn't rate-limit the runner. Full scans run every 3 hours.
light_scan:
  boards: [linkedin]
  locations: ["Bengaluru, Karnataka, India"]
  max_queries: 8

# Internships + fresher roles from sites JobSpy doesn't cover (public pages/APIs their robots.txt allows).
# Your internship queries map to: AI intern / GenAI intern → artificial-intelligence-ai · ML intern → machine-learning
# · data science intern → data-science · Python developer intern → python-django · SDE intern → software-development
# (+ computer-vision). Stipend floor: scoring.targets.min_stipend_inr_month (score.py).
internships:
  pause_sec: 1    # 2 put Internshala (42 requests) past its 90 s scan limit
  internshala:
    enabled: true
    places: [bangalore, work-from-home]         # work-from-home = remote India
    internships: [artificial-intelligence-ai, machine-learning, data-science, python-django, software-development, computer-vision]
    jobs: [artificial-intelligence-ai, machine-learning, data-science, python-django, software-development]
    max_details: 20                             # detail pages read per scan (start date, apply-by, full text), newest first
  unstop:
    enabled: true
    terms: ["AI intern", "ML intern", "data science intern", "GenAI intern", "Python developer intern", "SDE intern"]
    per_page: 20
  wellfound:
    enabled: true
    roles: [artificial-intelligence-engineer, machine-learning-engineer, data-scientist, software-engineer, python-developer]
    places: [bangalore, remote]

company_boards:
  enabled: true       # Greenhouse / Lever / Ashby / Workday boards from config/companies.yaml
  india_only: true    # then the Karnataka/remote filter applies

govt:
  enabled: true

alerts:
  urgent_score: 95           # 🚨 APPLY NOW: own pinned message, queued first, reminders at 2 h and 6 h
  urgent_per_day: 3          # more than this a day go out as normal alerts

scoring:
  alert_threshold: 60        # Telegram alert at or above this score
  dream_alert_threshold: 35  # dream companies alert lower
  govt_alert: eligible_or_check   # alert govt notices that are eligible or need a check
  digest_top_n: 20

apply:
  # check:        (default) the bot fills the real form, then a JobHunter panel on the page
  #               lists every field and where it came from. You read it, fix anything on the
  #               page, and press Submit. Every fix is remembered and wins next time.
  # basic_auto:   no panel: auto-submits ONLY when every field is a fact you gave;
  #               anything else is recorded for the Review Center (`hunt apply --auto`).
  # review_first: fill + record everything, submit nothing until you approve it.
  mode: check
  # When a form needs you and you're not checking (basic_auto / review_first):
  # "queue" records it for the Review Center and moves on; "wait" keeps the browser open.
  on_needs_you: queue
  # Resume to upload: "own" = your PDF exactly as you made it (config/resume.pdf, set with
  # `hunt resume --use FILE` or by sending the PDF to your Telegram bot), uploaded as
  # First_Last_Resume.pdf. "tailored" = a one-page PDF re-ordered for each job.
  resume: own
  sites_allowed_auto: [greenhouse, lever, ashby, linkedin, naukri, generic]
  never_auto_submit_on: [workday, indeed, govt]   # account creation / captcha / fees
  max_auto_submits_per_day: 25                    # all sites together
  max_per_site_per_day: {linkedin: 20, naukri: 25}
  min_score_for_auto: 45
  pause_range_sec: [35, 90]                       # human-like gap between applications
  typing_delay_ms: [30, 90]
  browser_profile_dir: data/browser-profile       # log in to LinkedIn/Naukri here once
  headless: false
  wait_for_you_sec: 900                           # how long the check panel waits for you (15 min)

schedule:
  light_minutes: 60
  full_minutes: 240
