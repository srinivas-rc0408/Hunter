ult:4278857"},{"__ref":"StartupResult:332168"},{"__ref":"StartupResult:655428"},{"__ref":"StartupResult:8889637"},{"__ref":"StartupResult:5889172"},{"__ref":"StartupResult:11045140"},{"__ref":"StartupResult:11458927"},{"__ref":"StartupResult:10002469"},{"__ref":"StartupResult:723166"},{"__ref":"StartupResult:11279533"},{"__ref":"StartupResult:9592959"},{"__ref":"StartupResult:2959198"},{"__ref":"StartupResult:10525514"},{"__ref":"StartupResult:10689394"},{"__ref":"StartupResult:10956062"},{"__ref":"StartupResult:500800"}]},"seoLandingPageRoleAndLocation({\"location\":\"bangalore\",\"page\":1,\"role\":\"machine-learning-engineer\"})":{"__ref":"RoleAndLocationEditorial:1048"}}},"Badge:ACTIVELY_HIRING":{"__typename":"Badge","id":"ACTIVELY_HIRING","name":"ACTIVELY_HIRING_BADGE","label":"Actively Hiring","tooltip":"Actively processing applications","avatarUrl":null,"rating":null,"data":null},"Badge:B2B-9077937":{"__typename":"Badge","id":"B2B-9077937","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-9077937":{"__typename":"Badge","id":"COMPANY_STAGE-9077937","name":"COMPANY_STAGE_BADGE","label":"Growth Stage","tooltip":"Expanding market presence","avatarUrl":null,"rating":null,"data":"growth_stage"},"Badge:TOP_INVESTORS-9077937":{"__typename":"Badge","id":"TOP_INVESTORS-9077937","name":"TOP_INVESTORS_BADGE","label":"Top Investors","tooltip":"This company has received a significant amount of investment from top investors","avatarUrl":null,"rating":null,"data":null},"Badge:RECENTLY_FUNDED":{"__typename":"Badge","id":"RECENTLY_FUNDED","name":"RECENTLY_FUNDED_BADGE","label":"Recently funded","tooltip":"Raised funding in the past six months","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:3650842":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Simplismart**\n\nSimplismart is a GenAI inference platform to deploy, scale, and monitor any GenAI model (LLMs, speech, vision, or diffusion) across cloud or on-prem. Built for strict SLAs, enterprise-grade security, and full observability. Its modular design lets you optimize for cost or latency or auto-select the best topology per workload.\n\n**Role Overview**\n\nIn this role, you will design and build the high-level architecture of Simplismart’s MLOps platform from the ground up, enabling scalable, reliable, and GPU-accelerated ML workflows across the product ecosystem.\n\n**What is expected from you-**\n\n* Design and implement the core architecture of a next-generation MLOps platform capable of running diverse GPU-accelerated workloads at scale.\n* Formalise and standardize heterogeneous ML workloads—including LLM/VLM/ASR/diffusion pipelines and build orchestration abstractions for them.\n* Build internal systems for continuous deployment of services, modules, and model pipelines across multi-cloud and hybrid environments.\n* Create frameworks for high reliability, observability, and fault-tolerance for mission-critical inference, training, and data pipelines.\n* Collaborate closely with Applied ML and Core ML teams to improve system reliability, latency, and cost efficiency. \n* Develop internal tooling to benchmark, evaluate, and deploy models quickly and consistently.\n* Ship production-grade code and infrastructure using strong engineering fundamentals and test-driven development (TDD), aligning with Simplismart’s engineering culture. \n* Troubleshoot complex systems, performance bottlenecks, GPU behavior, and distributed workloads.\n\n**What We’re Looking For-**\n\n* Deep technical expertise in system design, distributed systems, and GPU-based ML workloads.\n* Strong software engineering fundamentals (data structures, APIs, testing, debugging).\n* Experience with infrastructure-as-code (Terraform, Ansible) and cloud platforms (AWS/GCP/Azure).\n* Strong knowledge of ML fundamentals, model architectures (Transformers, CNNs), and inference behavior.\n* Ability to build, maintain, and reason about multi-step pipelines (ETL → model → evaluation → deploy).\n* Strong systems knowledge: Linux internals, networking, performance tuning, GPU memory behavior.\n* Ability to work independently, own large ambiguous problems, and collaborate across teams.\n* Excellent communication skills—able to articulate design decisions, tradeoffs, and system impacts clearly.\n\n**Good to Have-**\n\n* Experience with modern inference stacks such as TensorRT, Triton, vLLM/TGI, SGLang. \n* Exposure to quantization, model optimization, or CUDA concepts.\n* Hands-on experience with Llama/Mistral, Whisper, or Stable Diffusion pipelines. \n* Familiarity with CI/CD, Docker, GitHub workflows, and IaC-driven deployments.\n* Experience designing high-availability or fault-tolerant production systems.\n\n**Why Join Simplismart?**\n\n* Opportunity to define and lead the brand identity of a fast-growing GenAI company.\n* Work closely with leadership on high-impact initiatives from global event campaigns to overall storytelling.\n* Be part of a team that values design as a strategic lever, not just execution.\n* Competitive compensation and growth opportunities in a high-energy startup environment.","jobType":"full-time","liveStartAt":1789403438,"locationNames":["Bengaluru"],"primaryRoleTitle":"Machine Learning Engineer","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"machine-learning-engineer","title":"Machine Learning Engineer","compensation":"₹20L – ₹30L • No equity","yearsExperienceMin":3,"yearsExperienceMax":null,"id":"3650842","isBookmarked":false},"JobListingSearchResult:3650832":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Simplismart**\n\nSimplismart is a GenAI inference platform to deploy, scale, and monitor any GenAI model (LLMs, speech, vision, or diffusion) across cloud or on-prem. Built for strict SLAs, enterprise-grade security, and full observability. Its modular design lets you optimize for cost or latency or auto-select the best topology per workload.\n\n**Role Overview**\n\nWe are seeking a Technical Support Engineer with a strong focus on MLOps to provide enterprise-level assistance to our customers. In this role, you will diagnose and troubleshoot issues related to machine learning models, frameworks, and deployment pipelines. Your goal will be to ensure the seamless operation of ML systems and to assist our clients in leveraging these technologies effectively.\n\n**What is expected from you-**\n\n* Ownership of Issues: Take ownership of customer issues related to machine learning applications and see problems through to resolution.\n* Research and Diagnosis: Research, diagnose, troubleshoot, and identify solutions for software and hardware issues specifically related to machine learning environments.\n* Technical Support: Provide support for ML frameworks (e.g., TensorFlow, PyTorch) and tools (e.g., MLflow, Kubeflow) used in model training and deployment.\n* Network Configuration: Assist clients with network configuration issues that may affect ML model performance and data access.\n* Remote Support: Use remote desktop connections to provide immediate support and guidance to clients facing technical challenges in their ML workflows.\n* Communication: Communicate effectively via email, chat, and phone to provide clear instructions and technical manuals to clients.\n* Collaboration: Work closely with the Customer Success Manager and data science teams to ensure seamless support and integration of ML solutions.\n* Escalation: Properly escalate unresolved issues to appropriate internal teams, such as data scientists or software developers, when necessary.\n* Documentation: Document technical knowledge in the form of notes and manuals, particularly focusing on MLOps best practices and troubleshooting steps.\n* Follow-Up: Ensure all issues are properly logged and follow up with clients to confirm their ML systems are fully functional post-troubleshooting.\n\n**What We’re Looking For-**\n\n* Proven Experience: Demonstrated experience as a Technical Support Engineer, MLOps Engineer, or similar role with a focus on machine learning technologies.\n* Hands-On Experience: Proficiency with ML frameworks (e.g., TensorFlow, PyTorch) and familiarity with cloud platforms (e.g., AWS, Azure, GCP) for ML deployment.\n* Technical Troubleshooting: Ability to diagnose and troubleshoot technical issues related to ML model performance, data pipelines, and infrastructure.\n* Remote Desktop Applications: Familiarity with remote desktop applications and help desk software (e.g., Freshdesk) for efficient support delivery.\n* Problem-Solving Skills: Excellent problem-solving and communication skills, with the ability to explain complex technical concepts in simple terms.\n* Educational Background: BS degree in Information Technology, Computer Science, Data Science, or a relevant field.\n* Certifications: Additional certifications in machine learning, cloud computing, or relevant technologies (e.g., AWS Certified Machine Learning, Google Cloud Professional Data Engineer) are a plus.\n\n**Why Join Simplismart?**\n\n* Opportunity to define and lead the brand identity of a fast-growing GenAI company.\n* Work closely with leadership on high-impact initiatives from global event campaigns to overall storytelling.\n* Be part of a team that values design as a strategic lever, not just execution.\n* Competitive compensation and growth opportunities in a high-energy startup environment.","jobType":"full-time","liveStartAt":1792649576,"locationNames":["Bengaluru"],"primaryRoleTitle":"Other Engineering","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"lead-technical-support-engineer","title":"Lead Technical Support Engineer","compensation":"₹15L – ₹20L • No equity","yearsExperienceMin":5,"yearsExperienceMax":null,"id":"3650832","isBookmarked":false},"JobListingSearchResult:3870954":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Simplismart**\n\nSimplismart is a GenAI inference platform to deploy, scale, and monitor any GenAI model (LLMs, speech, vision, or diffusion) across cloud or on-prem. Built for strict SLAs, enterprise-grade security, and full observability. Its modular design lets you optimize for cost or latency or auto-select the best topology per workload.\n\n**Role Overview**\n\nWe are seeking a Technical Support Engineer with a strong focus on MLOps to provide enterprise-level assistance to our customers. In this role, you will diagnose and troubleshoot issues related to machine learning models, frameworks, and deployment pipelines. Your goal will be to ensure the seamless operation of ML systems and to assist our clients in leveraging these technologies effectively.\n\n**What is expected from you-**\n\n* Ownership of Issues: Take ownership of customer issues related to machine learning applications and see problems through to resolution.\n* Research and Diagnosis: Research, diagnose, troubleshoot, and identify solutions for software and hardware issues specifically related to machine learning environments.\n* Technical Support: Provide hands-on support for the ML frameworks and serving tools used across model deployment and inference.\n* Network Configuration: Assist clients with network configuration issues that may affect ML model performance and data access.\n* Remote Support: Familiarity with remote desktop applications and help desk software (e.g., Freshdesk) for efficient support delivery.\n* Communication: Communicate effectively via email, chat, and phone to provide clear instructions and technical manuals to clients.\n* Collaboration: Work closely with the Customer Success Manager and data science teams to ensure seamless support and integration of ML solutions.\n* Escalation: Properly escalate unresolved issues to appropriate internal teams, such as data scientists or software developers, when necessary.\n* Documentation: Document technical knowledge in the form of notes and manuals, particularly focusing on MLOps best practices and troubleshooting steps.\n* Follow-Up: Ensure all issues are properly logged and follow up with clients to confirm their ML systems are fully functional post-troubleshooting.\n* Technical Skills: Proficiency in Kubernetes troubleshooting, Linux, Python, and SQL, with working knowledge of cloud platforms (AWS, GCP, or Azure) and observability tooling such as Prometheus and Grafana. Familiarity with support and issue-tracking systems (Freshdesk, Jira) is expected. Experience in SAAS. \n* Experience with Helm, Docker, NVIDIA GPUs/CUDA, and inference engines such as vLLM, TensorRT-LLM, Triton Inference Server, or PyTorch is a strong plus.\n\n**What We’re Looking For-**\n\n* Proven Experience: Demonstrated experience as a Technical Support Engineer, MLOps Engineer, or similar role with a focus on machine learning technologies.\n* Hands-On Experience: Proficiency with ML frameworks (e.g., TensorFlow, PyTorch) and familiarity with cloud platforms (e.g., AWS, Azure, GCP) for ML deployment.\n* Technical Troubleshooting: Ability to diagnose and troubleshoot technical issues related to ML model performance, data pipelines, and infrastructure.\n* Remote Desktop Applications: Familiarity with remote desktop applications and help desk software (e.g., Freshdesk) for efficient support delivery.\n* Problem-Solving Skills: Excellent problem-solving and communication skills, with the ability to explain complex technical concepts in simple terms.\n* Educational Background: BS degree in Information Technology, Computer Science, Data Science, or a relevant field.\n* Certifications: Additional certifications in machine learning, cloud computing, or relevant technologies (e.g., AWS Certified Machine Learning, Google Cloud Professional Data Engineer) are a plus.\n\n**Why Join Simplismart?**\n\n* Opportunity to define and lead the brand identity of a fast-growing GenAI company.\n* Work closely with leadership on high-impact initiatives from global event campaigns to overall storytelling.\n* Be part of a team that values design as a strategic lever, not just execution.\n* Competitive compensation and growth opportunities in a high-energy startup environment.","jobType":"full-time","liveStartAt":1793035858,"locationNames":["Bengaluru"],"primaryRoleTitle":"Other Engineering","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"technical-support-engineer","title":"Technical Support Engineer","compensation":"No equity","yearsExperienceMin":2,"yearsExperienceMax":null,"id":"3870954","isBookmarked":false},"StartupResult:9077937":{"__typename":"StartupResult","id":"9077937","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2B-9077937"},{"__ref":"Badge:COMPANY_STAGE-9077937"},{"__ref":"Badge:TOP_INVESTORS-9077937"},{"__ref":"Badge:RECENTLY_FUNDED"}],"companySize":"SIZE_51_200","highConcept":"Tailor-made Inference for your usecase","highlightedJobListings":[{"__ref":"JobListingSearchResult:3650842"},{"__ref":"JobListingSearchResult:3650832"},{"__ref":"JobListingSearchResult:3870954"}],"logoUrl":"https://photos.wellfound.com/startups/i/9077937-04efbeb58dc9247199bf724fbbd011b2-medium_jpg.jpg?buster=1787032090","name":"Simplismart","slug":"simplismart"},"Badge:B2B-900217":{"__typename":"Badge","id":"B2B-900217","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-900217":{"__typename":"Badge","id":"COMPANY_STAGE-900217","name":"COMPANY_STAGE_BADGE","label":"Scale Stage","tooltip":"Rapidly increasing operations","avatarUrl":null,"rating":null,"data":"scale_stage"},"Badge:TOP_INVESTORS-900217":{"__typename":"Badge","id":"TOP_INVESTORS-900217","name":"TOP_INVESTORS_BADGE","label":"Top Investors","tooltip":"This company has received a significant amount of investment from top investors","avatarUrl":null,"rating":null,"data":null},"Badge:VALUATION_1B-900217":{"__typename":"Badge","id":"VALUATION_1B-900217","name":"VALUATION1B_BADGE","label":"Valuation $1B+","tooltip":"This company has a valuation of $1B or more","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:4289913":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Greenhouse::Listing","description":"Augury is building AgenticAI systems that transform how industrial organizations understand and optimize their operations. As a Senior ML Engineer on this team, you will help turn that vision into reality.\n\nYou will be part of the AgenticAI team, you will work closely with central Algorithm and Product teams to design, build, and deploy intelligent systems that power next-generation industrial AI applications.\n\nYou will own the end-to-end lifecycle of machine learning solutions—from problem definition and data exploration to model development, deployment, and production monitoring. Your work will span classical machine learning, time-series modeling, and generative AI to build agent-based systems that turn complex industrial data into actionable intelligence.\n\nYou will architect and implement Agentic applications that leverage heterogeneous data sources, including sensor-based time-series signals, unstructured text, and existing ML frameworks. These systems will directly power customer-facing workflows, delivering measurable operational impact for industrial manufacturers.\n\nThis role sits at the intersection of Agentic AI and Industrial AI, where your work will directly shape how customers interact with Augury’s platform and realize value from their data.\n\n**A Day In Your Life**\n\n- Own the full machine learning lifecycle: problem scoping, data exploration, pipeline development, model training, deployment, and monitoring in production.\n- Design and build Agentic AI systems that combine time-series modeling, signal processing, and generative AI (LLMs, embeddings, orchestration frameworks, and tool use).\n- Develop and deploy machine learning models for forecasting, anomaly detection, and pattern recognition in industrial sensor data.\n- Integrate classical statistical methods, deep learning, and GenAI techniques to generate actionable insights from complex datasets.\n- Build scalable data pipelines and ML systems that operate reliably in production environments.\n- Collaborate with Product, Engineering, and Algorithm teams to define solutions and translate customer needs into technical implementations.\n- Partner with customers and internal stakeholders to identify new data-driven opportunities and emerging use cases.\n- Implement robust evaluation, monitoring, and drift detection systems for live ML/Agentic applications.\n\n**What You Bring**\n\n- Bachelor’s degree in Computer Science, Engineering, or related technical field (B.Tech / B.E. or equivalent).\n- Master’s degree (M.Tech or equivalent) is a plus but not required.\n- Equivalent industry experience will be considered for exceptional candidates.\n- 4+ years of experience in Machine Learning, Applied AI, or related fields.\n- Proven ability to own and deliver end-to-end ML systems in production environments.\n- Strong experience in time-series modeling, forecasting, anomaly detection, and feature engineering.\n- Hands-on experience with Python and ML frameworks (e.g., Pydantic, PTorch, TensorFlow, Scikit-learn, or similar).\n- Familiarity with generative AI systems, including LLMs, embeddings, and agent-based architectures (e.g. Langchain, LangGraph, DSPy)\n- Experience building or working with Agentic applications or LLM-powered systems.\n- Strong understanding of data pipelines and production ML systems (deployment, monitoring, retraining, drift detection).\n- Experience working in Agile, fast-paced, cross-functional environments.\n- Strong collaboration skills with distributed teams across engineering, product, and data functions.\n\n**Nice to Have**\n\n- Experience in industrial AI, IoT, predictive maintenance, or manufacturing systems.\n- Exposure to digital twins, context graphs, or knowledge graph-based systems.\n- Familiarity with modern data platforms such as Databricks, BigQuery, Snowflake, or similar.\n- Understanding of optimization frameworks (e.g., Pyomo, Gurobi, OR-Tools).\n- Experience working with large-scale distributed data systems.\n\n**Perks**\n\n- Stock options\n- Paid parental leave\n- Flex PTO\n","jobType":"full-time","liveStartAt":1780431343,"locationNames":["Bengaluru"],"primaryRoleTitle":"Data Scientist","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"machine-learning-engineer","title":"Machine Learning Engineer ","compensation":"","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"4289913","isBookmarked":false},"StartupResult:900217":{"__typename":"StartupResult","id":"900217","badges":[{"__ref":"Badge:B2B-900217"},{"__ref":"Badge:COMPANY_STAGE-900217"},{"__ref":"Badge:TOP_INVESTORS-900217"},{"__ref":"Badge:VALUATION_1B-900217"}],"companySize":"SIZE_51_200","highConcept":"Machines talk, we listen","highlightedJobListings":[{"__ref":"JobListingSearchResult:4289913"}],"logoUrl":"https://photos.wellfound.com/startups/i/900217-294af8a634a5341207ae80e1afffce72-medium_jpg.jpg?buster=1459779194","name":"Augury","slug":"augury"},"Badge:B2B-204754":{"__typename":"Badge","id":"B2B-204754","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-204754":{"__typename":"Badge","id":"COMPANY_STAGE-204754","name":"COMPANY_STAGE_BADGE","label":"Growth Stage","tooltip":"Expanding market presence","avatarUrl":null,"rating":null,"data":"growth_stage"},"JobListingSearchResult:3347585":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Greenhouse::Listing","description":" \n\n**About the role**\n\nWe are seeking a Machine Learning Engineer Intern to contribute to the development of computer vision algorithms focused on item authentication and fingerprinting. In this role, you will support the research, development, and deployment of algorithms and models aimed at accurately determining the authenticity of items through the analysis of their unique visual characteristics and assigning unique digital identities based on image data.   \nYou will also assist in refining the image capture experience on edge devices and contribute to ensuring model interpretability.\n\n**Reports to:** ML Lead  \n**Location:** Remote or Hybrid in Bangalore, India  \n**Duration:**  6 months internship with an opportunity for PPO\n\n**What You'll Do:**\n\n- **Algorithm Research \u0026 Support:** Assist in researching, designing, and training computer vision models for authentication, fingerprinting, image capture, and other customer-centric computer vision applications.\n- **Code Quality \u0026 Testing:** Write clean, modular, and well-tested code. Develop unit and integration tests to maintain high standards of code quality and reliability. Participate in code reviews, contributing to pull requests and collaborating with team members.\n- **Model Deployment Support:** Provide support in building and maintaining APIs to efficiently deploy models in production.\n- **Continuous Learning:** Stay current with advancements in Computer Vision and Machine Learning.\n- **Collaboration:** Work with internal teams to understand needs and gather feedback on algorithm performance.\n- **Documentation:** Contribute to clear and concise documentation of algorithms and models.\n\n#### **Who you are:**\n\n- Currently pursuing a Bachelor's or Master's degree in Electronics, Physics, Computer Science, or a related field.\n- Foundational understanding of Computer Vision algorithm development.\n- Familiarity with Python.\n- Basic understanding of PyTorch and OpenCV.\n- Strong foundational skills in probability \u0026 statistics, calculus, geometry, optimization, and linear algebra.\n- Ability to rapidly acquire new skills and technologies.\n- Strong problem-solving skills and attention to detail.\n- Willingness to contribute to code reviews and collaborate with peers.\n\n**What we offer**\n\n- Market-competitive compensation structure\n- Opportunities to gain hands-on experience in cutting-edge computer vision solutions.\n- A collaborative, mission-driven work culture with direct product impact.\n- Mentorship from experienced Machine Learning Engineers.\n- Opportunities to learn about deploying models on edge devices.\n\nWe have had an incredible run so far and laying the foundation for a culture that is fast-paced, entrepreneurial, and rooted in passion, kindness, and positivity. We live by these values – we hire by them, promote them, and celebrate them every day. \n\nIf you are a passionate and eager individual looking to kickstart your career in Computer Vision and Machine Learning, we'd love to connect!\n\n","jobType":"full-time","liveStartAt":1794245427,"locationNames":["Bengaluru"],"primaryRoleTitle":"Machine Learning Engineer","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"3-ml-intern","title":"ML Intern","compensation":"","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"3347585","isBookmarked":false},"StartupResult:204754":{"__typename":"StartupResult","id":"204754","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2B-204754"},{"__ref":"Badge:COMPANY_STAGE-204754"}],"companySize":"SIZE_51_200","highConcept":"Instantly authenticate high-value physical goods","highlightedJobListings":[{"__ref":"JobListingSearchResult:3347585"}],"logoUrl":"https://photos.wellfound.com/startups/i/204754-d69f252d7edb64a90f6487bb2e79696a-medium_jpg.jpg?buster=1404780403","name":"Entrupy","slug":"entrupy"},"Badge:B2B-517943":{"__typename":"Badge","id":"B2B-517943","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-517943":{"__typename":"Badge","id":"COMPANY_STAGE-517943","name":"COMPANY_STAGE_BADGE","label":"Growth Stage","tooltip":"Expanding market presence","avatarUrl":null,"rating":null,"data":"growth_stage"},"Badge:GROWING_FAST-517943":{"__typename":"Badge","id":"GROWING_FAST-517943","name":"GROWING_FAST_BADGE","label":"Growing fast","tooltip":"Showed strong hiring growth in the past month","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:3534689":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"​​SciSpace is the world's largest platform for researchers to create, collaborate and publish their research. \n\nUsed by millions of researchers across 91 countries from organizations such as MIT, Stanford, CERN, NASA, and the like, including Nobel Laureates. Other solutions provided by SciSpace cater to various scholarly content creation(B2C), publication (B2B publishers), and dissemination (B2B universities) needs. (Featured in Forbes, Nasdaq, and Entrepreneur magazine.\n\nSciSpace is a series-funded startup. We have raised 4.5 million USD to date, with the most recent fundraise in October 2021 from US-based VC firms. We have expanded our product portfolio with the launch of “SciSpace” - the world’s largest social platform for Research - hosting 200M+ publications and 50M+ profiles. \n\nThink of it like medium.com for hosting and discovering academic papers. We are looking for insatiably curious, always learning Senior Research Scientist. You could get a chance to work on the most important and challenging problems at scale.\n\nAs an AI Agentic Engineer dedicated to developing Gen AI based ML systems, you will be involved in deployment of GenAI models, building ML systems and pipelines to ensure reliable systems are deployed at scale to provide value for researchers. \n\nThis is an engineering dominated role but the candidate should have basic knowledge of ML especially NLP Transformer based (LLM) models to be able to handle the systems better.\n\n**Responsibilities:**\n\n* ML System Development: Design, develop, and maintain scalable and efficient machine learning systems, including writing ML services and APIs.\n* Hands on expereince in Backend and System Design \n* Model Deployment: Implement and manage the deployment of machine learning models, including transformer based LLMs, into production environments, ensuring reliability and scalability.\n* Infrastructure Management: Collaborate with infrastructure teams to optimize and manage the underlying systems supporting machine learning workflows.\n* Data Pipeline Creation: Create robust and efficient data pipelines for collecting, processing, and preparing datasets for machine learning models.\n* Collaboration: Work closely with data scientists, researchers, and cross-functional teams to integrate ML solutions into existing software infrastructure.\n* Performance Optimization: Continuously optimize and improve the performance of machine learning algorithms and systems.\n* Documentation: Develop and maintain documentation for machine learning systems, APIs, and data pipelines to ensure clarity and ease of use for team members.\n\n \n**Our ideal candidates would:**\n* 5+ years of experience including working on designing multi-component systems\n* Strong grasp of one high-level language like Python \u0026amp; FastAPI.\n* General awareness of SQL and database design concepts\n* Solid understanding of testing fundamentals\n* Strong communication skills\n* should have prior experience in managing and executing technology products.\n* Decent understanding of various Gen AI based ML approaches\n* Experience in building agentic architectures using langgraph or similar libraries\n\t\n**\tBonus:**\n* Prior experience working with high-volume, always-available web-applications\n* Experience working with cloud \n* Knowledge of cloud platforms such as AWS, GCP, or Azure.\n* Experience with deploying small and big open source LLMs in production environments using containerization tools like Docker\n* Experience in Distributed systems.\n* Experience working with Start-up is a plus point.","jobType":"full-time","liveStartAt":1794899194,"locationNames":["Bengaluru"],"primaryRoleTitle":"Machine Learning Engineer","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"senior-agentic-ai-engineer","title":"Senior Agentic AI Engineer","compensation":"₹30L – ₹47L • 0.02% – 0.05%","yearsExperienceMin":5,"yearsExperienceMax":null,"id":"3534689","isBookmarked":false},"StartupResult:517943":{"__typename":"StartupResult","id":"517943","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2B-517943"},{"__ref":"Badge:COMPANY_STAGE-517943"},{"__ref":"Badge:GROWING_FAST-517943"}],"companySize":"SIZE_11_50","highConcept":"The AI Research Co-Scientist (ChatGPT for Research) ","highlightedJobListings":[{"__ref":"JobListingSearchResult:3534689"}],"logoUrl":"https://photos.wellfound.com/startups/i/517943-03ae92ca8a409131651b57a1da8f48c6-medium_jpg.jpg?buster=1764932437","name":"SciSpace ","slug":"typeset"},"Badge:B2B-4278857":{"__typename":"Badge","id":"B2B-4278857","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-4278857":{"__typename":"Badge","id":"COMPANY_STAGE-4278857","name":"COMPANY_STAGE_BADGE","label":"Public Stage","tooltip":"Publicly traded company","avatarUrl":null,"rating":null,"data":"public_stage"},"JobListingSearchResult:255384":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"We are looking for an exceptional software engineer with a proven track record in a computer vision and graphics (e.g. multiple view geometry, deep learning, object detection/tracking ). As a computer vision engineer, you'll be solving challenges that are at the confluence of real-time vision and augmented reality.\r\n\r\nResponsibilities\r\nThe ideal candidate should be comfortable making significant contributions in a few of the following categories:\r\n* Developing creative computer vision and imaging software  \r\n* Developing novel real-time classification algorithms for defense\r\n* Applying machine learning to computer vision problems. \r\n* Researching and prototyping techniques and algorithms for object detection and recognition. \r\n* Developing robust software for integrating multiple sensors and tracking systems.  \r\n* Prototyping hardware and software solutions for tracking, detection, classification and modeling. \r\n\r\nRequirements:\r\n* BE/MS or PhD degree in Computer Science, Computer Vision, Deep Learning, Machine Learning, or related technical field preferred. \r\n* 3+ years developing and designing Computer Vision technologies and systems \r\n* 3+ years of experience engineering in C++ \r\n* Strong background in Computer Vision. \r\n* Fast prototyping skills\r\n* Practical knowledge of machine learning, Bayesian filtering, information theory, deep learning, image classification and 3D geometry","jobType":"full-time","liveStartAt":1703657593,"locationNames":["Bengaluru"],"primaryRoleTitle":"Software Engineer","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"computer-vision-engineer","title":"Computer Vision Engineer","compensation":"$20k – $25k","yearsExperienceMin":0,"yearsExperienceMax":null,"id":"255384","isBookmarked":false},"StartupResult:4278857":{"__typename":"StartupResult","id":"4278857","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2B-4278857"},{"__ref":"Badge:COMPANY_STAGE-4278857"},{"__ref":"Badge:RECENTLY_FUNDED"}],"companySize":"SIZE_201_500","highConcept":"Imaging and Sensor Systems for Defence, Homeland Security hip","tooltip":"Employees rate 6sense 4.8/5 on Glassdoor for faith in leadership","avatarUrl":null,"rating":"4.8","data":null},"JobListingSearchResult:3311016":{"__typename":"JobListingSearchResult","autoPosted":true,"atsSource":null,"description":"**Our Mission:** \n\n6sense is on a mission to revolutionize how B2B organizations create revenue by predicting customers most likely to buy and recommending the best course of action to engage anonymous buying teams. 6sense Revenue AI is the only sales and marketing platform to unlock the ability to create, manage and convert high-quality pipeline to revenue. \n\n**Our People:** \n\nPeople are the heart and soul of 6sense. We serve with passion and purpose. We live by our Being 6sense values of Accountability, Growth Mindset, Integrity, Fun and One Team. Every 6sensor plays a part in deﬁning the future of our industry-leading technology.  6sense is a place where difference-makers roll up their sleeves, take risks, act with integrity, and measure success by the value we create for our customers. \n\nWe want 6sense to be the best chapter of your career. \n\nAs a Lead Software Engineer, you will be instrumental in architecting, developing, and delivering scalable, high-performance software solutions. This role demands strong technical acumen, leadership capabilities, and a collaborative mindset to partner with cross-functional teams in addressing complex engineering challenges. You’ll drive architectural decisions, mentor team members, and ensure timely delivery of impactful, business-aligned features. \n\n**Key Responsibilities:**\n\n- Lead the design, development, and delivery of complex software systems.\n- Champion technical innovation and establish best practices within the engineering teams.\n- Maintain high standards of code quality through thorough reviews, automation, and adherence to development guidelines.\n- Architect scalable, secure, and reliable systems for critical business applications.\n- Collaborate with product and business stakeholders to gather requirements and translate them into effective technical solutions.\n- Align engineering initiatives with business objectives to ensure strategic goals are met.\n- Troubleshoot, analyze, and resolve intricate technical issues.\n- Define and implement strategies to enhance system reliability, performance, and reduce technical debt.\n\n**Qualifications :**\n\n- Bachelor’s or master's degree in computer science, Engineering, or a related discipline.\n- Minimum 7 years of professional software engineering experience, with at least 2 years in a senior or leadership capacity.\n- Proficient in Python, with strong experience in Django and FastAPI.\n- Deep understanding of distributed systems architecture, databases (both SQL and NoSQL), and caching mechanisms.\n- Experience with distributed system observability, including APM, OpenTelemetry (OTel), and performance monitoring tools.\n- Strong analytical and problem-solving abilities.\n- Excellent communication skills, capable of conveying complex technical concepts to non-technical audiences.\n- Demonstrated leadership experience, including mentoring engineers and leading technical projects.\n- Hands-on experience with containerization technologies such as Docker and Kubernetes.\n- Familiarity with CI/CD pipelines and modern DevOps practices.\n- Exposure to machine learning or data analytics platforms is a plus. #LI-remote\n\n**Our Benefits:** \n\nFull-time employees can take advantage of health coverage, paid parental leave, generous paid time-off and holidays, quarterly self-care days off, and stock options. We’ll make sure you have the equipment and support you need to work and connect with your teams, at home or in one of our oﬃces. \n\nWe have a growth mindset culture that is represented in all that we do, from onboarding through to numerous learning and development initiatives including access to our LinkedIn Learning platform. Employee well-being is also top of mind for us. We host quarterly wellness education sessions to encourage self care and personal growth. From wellness days to ERG-hosted events, we celebrate and energize all 6sense employees and their backgrounds. \n\n**Equal Opportunity Employer:** \n\n6sense is an Equal Employment Opportunity and Affirmative Action Employers. Qualified applicants will receive consideration for employment without regard to race, color, religion, sex, sexual orientation, gender perception or identity, national origin, age, marital status, protected veteran status, or disability status. If you require reasonable accommodation in completing this application, interviewing, completing any pre-employment testing, or otherwise participating in the employee selection process, please direct your inquiries to [jobs@example.com](mailto:jobs@example.com)[.](mailto:jobs@example.com) \n\n*We are aware of recruiting impersonation attempts that are not affiliated with 6sense in any way. All email communications from 6sense will originate from the jobs@example.com domain. We will not initially contact you via text message and will never request payments. If you are uncertain whether you have been contacted by an official 6sense employee, reach out to [jobs@example.com](mailto:jobs@example.com) *\n\n","jobType":"full-time","liveStartAt":1749086879,"locationNames":["Bengaluru"],"primaryRoleTitle":"Software Engineer","remote":false,"remoteConfig":null,"acceptedRemoteLocationNames":[],"slug":"lead-software-engineer","title":"Lead Software Engineer ","compensation":"","yearsExperienceMin":null,"yearsExperienceMax":null,"id":"3311016","isBookmarked":false},"StartupResult:332168":{"__typename":"StartupResult","id":"332168","badges":[{"__ref":"Badge:B2B-332168"},{"__ref":"Badge:COMPANY_STAGE-332168"},{"__ref":"Badge:TOP_INVESTORS-332168"},{"__ref":"Badge:YC-332168"},{"__ref":"Badge:VALUATION_1B-332168"},{"__ref":"Badge:HIGHLY_RATED-332168"},{"__ref":"Badge:WORK_LIFE_BALANCE-332168"},{"__ref":"Badge:STRONG_LEADERSHIP-332168"}],"companySize":"SIZE_501_1000","highConcept":"Gives revenue teams the power to know everything, so they can do anything","highlightedJobListings":[{"__ref":"JobListingSearchResult:3311016"}],"logoUrl":"https://photos.wellfound.com/startups/i/332168-8a05c769d3f6d02b66fffc93164bc28d-medium_jpg.jpg?buster=1589650734","name":"6sense","slug":"6sense"},"Badge:B2C-655428":{"__typename":"Badge","id":"B2C-655428","name":"B2C_BADGE","label":"B2C","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-655428":{"__typename":"Badge","id":"COMPANY_STAGE-655428","name":"COMPANY_STAGE_BADGE","label":"Scale Stage","tooltip":"Rapidly increasing operations","avatarUrl":null,"rating":null,"data":"scale_stage"},"Badge:TOP_INVESTORS-655428":{"__typename":"Badge","id":"TOP_INVESTORS-655428","name":"TOP_INVESTORS_BADGE","label":"Top Investors","tooltip":"This company has received a significant amount of investment from top investors","avatarUrl":null,"rating":null,"data":null},"Badge:VALUATION_500M-655428":{"__typename":"Badge","id":"VALUATION_500M-655428","name":"VALUATION500M_BADGE","label":"Valuation $500M+","tooltip":"This company has a valuation of $500M or more","avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:5034661":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"Branch Overview\nBranch is a leading AI-powered lending fintech with 50M+ downloads across India and Africa. We use alternative data and machine learning to expand financial access for millions of people traditionally excluded from the formal financial system. Founded by the former CEO of Kiva.org and backed by leading investors including Andreessen Horowitz, Visa, and the IFC, Branch combines mission-driven impact with world-class technology and scale.\n\nIn India, Branch operates as a regulated digital lending institution and Middle Layer NBFC, building trusted and accessible financial products for millions of customers across the country. Our 250+ member India team is growing rapidly and works across technology, data science, risk, product, and operations to solve high-impact problems at scale. \n\nCertified as a Great Place to Work in 2025, Branch offers the opportunity to build meaningful careers while shaping the future of inclusive fintech in one of the world’s fastest-growing digital economies.\n\nAbout Role\nWe are seeking a hands-on Cloud Security Engineer to help secure the infrastructure and platforms that power our global Fin-Tech systems. In this role, you will work at the intersection of cloud infrastructure, security engineering, and DevSecOps to identify attack surfaces, strengthen security guardrails, and embed security directly into our engineering workflows. You will focus on securing our AWS environments, container platforms, and deployment pipelines while helping engineers design systems that are resilient to real-world threats.\n\nYou will collaborate closely with platform engineers, DevOps teams, and application developers to proactively identify risks, automate security controls, and improve the overall security posture of our systems. This role requires someone who can think like an attacker but build like an engineer. You are someone who enjoys identifying weaknesses, designing preventative controls, and building security automation that scales with the platform.\n\nYou will work closely with our engineering teams across India, the United States, Nigeria, and Kenya, collaborating across time zones to help build and secure a world-class Fin-Tech platform serving millions of users globally.\n\nAs a company, we are passionate about our customers, fearless in the face of barriers, and driven by data. As an engineering team, we value bottom-up innovation and decentralized decision-making. We believe the best ideas can come from anyone in the company. We work hard to create an environment where everyone feels empowered to propose solutions, challenge assumptions, and drive meaningful impact. We are looking for individuals who thrive in a fast-moving, innovative, and customer-focused setting and want to contribute to building scalable, reliable, and efficient backend systems.\n\nAs a company, we are passionate about our customers, fearless in the face of barriers, and driven by data. As an engineering team, we value bottom-up innovation and decentralized decision-making: We believe the best ideas can come from anyone in the company, and we are working hard to create an environment where everyone feels empowered to propose solutions to the challenges we face. We are looking for individuals who thrive in a fast-moving, innovative, and customer-focused setting.\n\nResponsibilities\nIdentify and secure attack surfaces across our AWS infrastructure, Kubernetes clusters, and internal platforms by proactively assessing misconfigurations, access risks, and exposed services.\nDesign and implement preventative cloud security guardrails including IAM hardening, network controls, secrets management, and infrastructure security best practices.\nConduct security design reviews for new services and infrastructure changes to identify architectural risks before systems reach production.\nBuild and integrate security checks directly into CI/CD pipelines to enforce automated scanning for vulnerabilities, container images, infrastructure configurations, and application dependencies.\nDevelop automation and internal tooling to detect, prevent, and remediate security issues such as leaked secrets, excessive permissions, insecure configurations, and vulnerable dependencies.\nPerform threat modeling and adversarial analysis of infrastructure and application systems to identify realistic attack paths and improve system defenses.\nImprove visibility into the security posture of our systems through monitoring, logging, and security signal generation across cloud infrastructure and workloads.\nInvestigate security incidents and vulnerabilities, perform root cause analysis, and implement long-term fixes to prevent recurrence.\nCollaborate closely with platform, infrastructure, and application engineering teams to ensure security is embedded in development workflows and infrastructure design.\nContribute to building scalable security practices including vulnerability management processes, security automation frameworks, and infrastructure security standards.\n\nQualifications\n4+ years of experience in cloud security, DevSecOps, security engineering, or related roles involving infrastructure and application security.\nStrong understanding of applied cryptography and ability to choose the right security tools, techniques, and approach for securing systems from a variety of threats.\nStrong hands-on experience securing AWS environments including IAM policies, networking controls, access management, logging, and infrastructure hardening.\nPractical experience working with Kubernetes and containerized environments, including securing container images, workloads, and cluster configurations.\nExperience integrating security controls into CI/CD pipelines and development workflows, including automated vulnerability scanning and dependency security checks.\nAbility to write automation and security tooling using scripting or programming languages such as Python, Go, or similar.\nFamiliarity with Infrastructure-as-Code tools such as Terraform and an understanding of securing infrastructure configurations and deployment pipelines.\nExperience identifying and remediating cloud security risks such as excessive IAM permissions, exposed services, insecure secrets management, and vulnerable infrastructure components.\nUnderstanding of common cloud and application security threats including privilege escalation, credential leakage, network exposure, and supply chain vulnerabilities.\nStrong problem-solving mindset with the ability to think adversarially about systems and proactively identify potential attack paths.\nExcellent collaboration and communication skills (verbal as well as written) with the ability to work closely with engineering teams and other stakeholders to improve security posture without slowing development velocity.\nBonus experience includes security research, penetration testing, bug bounty participation, building internal security tooling, or contributions to security-focused open-source projects.\nBonus abilities include ability to lead and mentor a team, and ability to drive complex projects spanning code bases, systems, and people.\n\n\nBenefits of Joining\nCompetitive salary and equity package\nFast-paced, collaborative, and high-autonomy work culture\nHybrid work setup designed for flexibility and work-life balance\nFully paid group medical insurance and personal accident insurance\nGenerous paid time off, plus company-declared public holidays\nFully paid parental leave for fathers and non-birthing parents (12 weeks), in addition to 26 weeks of statutory maternity leave\nMonthly WFH stipend, along with a one-time home office setup budget\n$500 annual professional development budget\nQuarterly social meet-ups and sponsored monthly team lunches\n \nWe’re looking for more than just qualifications --  if you’re unsure that you meet the criteria but identify with our vision of providing equal opportunity to everyone to access financial services, please do not hesitate to apply!\n\n \nBranch International is an Equal Opportunity Employer. The company does not and will not discriminate in employment on any basis prohibited by applicable law.","jobType":"full-time","liveStartAt":1794314467,"locationNames":["Bengaluru"],"primaryRoleTitle":"Security Engineer","remote":true,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"REMOTE","wfhFlexible":false},"acceptedRemoteLocationNames":[],"slug":"platform-security-engineer","title":"Platform Security Engineer","compensation":"₹25L – ₹40L","yearsExperienceMin":4,"yearsExperienceMax":null,"id":"5034661","isBookmarked":false},"StartupResult:655428":{"__typename":"StartupResult","id":"655428","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2C-655428"},{"__ref":"Badge:COMPANY_STAGE-655428"},{"__ref":"Badge:TOP_INVESTORS-655428"},{"__ref":"Badge:VALUATION_500M-655428"}],"companySize":"SIZE_201_500","highConcept":"Financial Access. Anytime, anywhere","highlightedJobListings":[{"__ref":"JobListingSearchResult:5034661"}],"logoUrl":"https://photos.wellfound.com/startups/i/655428-0c93d7b1b0972fdc10073c42049ec0d3-medium_jpg.jpg?buster=1545329987","name":"Branch","slug":"branch"},"Badge:B2B-8889637":{"__typename":"Badge","id":"B2B-8889637","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-8889637":{"__typename":"Badge","id":"COMPANY_STAGE-8889637","name":"COMPANY_STAGE_BADGE","label":"Early Stage","tooltip":"Startup in initial stages","avatarUrl":null,"rating":null,"data":"early_stage"},"JobListingSearchResult:3239136":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":"AtsIntegration::Ashby::Listing","description":"# **Who are we?**\n\n##   \n**Mission**\n\nAltimate AI, founded in 2022 in San Francisco, is revolutionizing enterprise data operations through the power of AI. Our mission is to alleviate the burden on overworked and understaffed enterprise data teams by providing innovative AI-driven solutions that automate and accelerate a wide range of data tasks. Our flagship product, DataPilot, offers advanced data automation capabilities, while our new DataMates technology brings the concept of agentic AI to data operations, acting as virtual teammates for data professionals. Our solutions seamlessly fit into existing tools like [VSCode](https://marketplace.visualstudio.com/items?itemName=innoverio.vscode-dbt-power-user), Git, and Slack, performing tasks ranging from data documentation to performance optimization.\n\nBy leveraging a proprietary framework that combines multiple language models and a custom-built knowledge graph, we enable contextually aware AI agents that integrate seamlessly into existing workflows. Our solutions, including ambient AI for continuous monitoring and optimization, are designed to meet the growing demands of data operations, business intelligence, and analytics in an era of ever-increasing data volumes. Used by thousands of users across the world, and backed by prominent investors , we're positioned at the forefront of the AI-powered data engineering revolution.\n\nYou can read more about us in a recently published [venture beat article](https://venturebeat.com/ai/how-agentic-ai-could-improve-enterprise-data-operations/).\n\n##   \nTeam\n\nAs a team, we are Silicon Valley veterans who previously created category-defining data and AI products loved by thousands of companies worldwide. We have experienced the journey of a small startup to IPO very closely. We have started on a similar journey again and are backed by prominent advisors and VC firms with multi-billion dollar portfolios.\n\n##   \nWhat are we looking for?\n\nWe're in search of a Staff Software Engineer who brings a passion for innovation and problem-solving, not limited to traditional coding. This role is for those with deep expertise in server-side languages, database technologies, and cloud infrastructure, excited to design and build the backbone of our AI solutions. The ideal candidate will play a crucial role in enhancing our AI capabilities, developing high-performance back-end systems, and integrating advanced AI into data teams' daily workflows.\n\n**Qualifications**:\n\n**Required:**\n\n- 10+ years of experience building Python-based web application backends and the infrastructure on which they run\n- Extensive experience in building scalable back-end systems, APIs, and microservices\n- Deep understanding of cloud platforms (AWS, Azure, GCP) and containerization technologies (Docker, Kubernetes)\n\n**Preferred:**\n\n- Experience with FastAPI for building high-performance APIs\n- Familiarity with AI and machine learning concepts, particularly in the context of Large Language Models (LLMs)\n- Strong proficiency in SQL, including query profiling, optimization, and performance tuning\n- Experience with SQL Abstract Syntax Tree (AST) analysis and working with SQL parsers (e.g., sqlglot)\n\n##   \nWhy you should join Altimate AI\n\n**Projects You'll Work On**:\n\n- **Backend Integration of LLM Architectures**: Lead the development and maintenance of the backend infrastructure that powers state-of-the-art Large Language Model (LLM) architectures, including RAG, ReAct, and Agent-based systems. Architect data pipelines for processing extensive datasets and devise AI-powered endpoints crucial for our SaaS application and VSCode Extension.\n- **Graph-Based Data Structure Design**: Design and develop large-scale graph-based data structures that effectively model complex data stores. Create intricate, efficient structures that can be fed to our AI applications as context, ensuring both scalability and performance.\n- **Intelligent SQL Ecosystem**: Lead the design and development of a comprehensive SQL intelligence system encompassing query optimization, dynamic pipeline generation, and data lineage tracking. Leverage expertise in SQL query profiling, AST analysis, and parsing to create a sophisticated engine focused on query performance improvements and implementing granular column-level lineage.\n\n**Impact**:\n\n- **Innovation at the Forefront**: Push the boundaries of software engineering by combining traditional techniques with cutting-edge AI technologies.\n- **High Visibility \u0026 Impact**: Directly affect the productivity and capabilities of global data teams, as your contributions will be crucial to the daily operations of thousands of users spread across 100s of countries.\n- **Open Source Contribution**: As part of our commitment to the developer community, you will contribute to our open-source initiatives, gaining recognition in the tech community.\n- **Career Growth**: This role is a launchpad into the rapidly advancing field of AI, offering exposure to state-of-the-art technologies and generative AI applications.\n\n## How to Apply\n\nIf this sounds like the perfect role for you, we can't wait to meet you! Apply now and let's build something amazing together.\n\n","jobType":"full-time","liveStartAt":1786144937,"locationNames":["Bengaluru"],"primaryRoleTitle":"Software Engineer","remote":true,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":["India"],"slug":"staff-software-engineer-india","title":"Staff Software Engineer - India","compensation":"$30k – $90k • 0.01% – 0.1%","yearsExperienceMin":8,"yearsExperienceMax":null,"id":"3239136","isBookmarked":false},"StartupResult:8889637":{"__typename":"StartupResult","id":"8889637","badges":[{"__ref":"Badge:B2B-8889637"},{"__ref":"Badge:COMPANY_STAGE-8889637"}],"companySize":"SIZE_11_50","highConcept":"AI Team-mate for Data Engineering Teams","highlightedJobListings":[{"__ref":"JobListingSearchResult:3239136"}],"logoUrl":"https://photos.wellfound.com/startups/i/8889637-cb97ceaaf08caca412036ff63d816cb0-medium_jpg.jpg?buster=1652389133","name":"Altimate AI","slug":"altimate-1"},"Badge:B2B-5889172":{"__typename":"Badge","id":"B2B-5889172","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"Badge:COMPANY_STAGE-5889172":{"__typename":"Badge","id":"COMPANY_STAGE-5889172","name":"COMPANY_STAGE_BADGE","label":"Early Stage","tooltip":"Startup in initial stages","avatarUrl":null,"rating":null,"data":"early_stage"},"JobListingSearchResult:3907445":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Senzcraft**: Founded by IIM Bangalore and IEST Shibpur Alumni, Senzcraft is a hyper-automation company. Senzcraft vision is to Radically Simplify Today's Work. And Design Business Process For The Future. Usi ign. \n* Experience working with Vector Databases (FAISS, Pinecone, Weaviate, or MongoDB).\n* Familiarity with LLMs (OpenAI, Azure OpenAI, Anthropic Claude, Meta Llama, etc.). \n* Deep understanding of Machine Learning algorithms – regression, decision trees, SVM, random forests, deep learning, and reinforcement learning. \n* Strong proficiency in Python and FastAPI. \n* Expertise with frameworks such as TensorFlow, PyTorch, scikit-learn, and Keras. \n* Strong foundation in mathematics and statistics (linear algebra, calculus, probability, and statistics). \n* Experience in SQL, data preprocessing, and feature engineering. \n\n** Good to Have **\n\n* Working knowledge of AI Ops tools – LangFuse, Jenkins, Docker, Groovy, FitNesse, and CI/CD pipelines. \n* Experience in LLM fine-tuning. \n* Exposure to eRAG (Azure-based RAG solution). \n* Familiarity with prompt engineering and LLM observability tools. \n* Understanding on NFRs, solution architecture and deployment models","jobType":"full-time","liveStartAt":1772007028,"locationNames":["Bengaluru"],"primaryRoleTitle":"Engineering","remote":true,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE_OR_REMOTE","wfhFlexible":false},"acceptedRemoteLocationNames":[],"slug":"urgent-gen-ai-engineer-2-yrs-immediate-30-days-preferred","title":"*Urgent* Gen AI Engineer/2+ Yrs/Immediate-30 days preferred","compensation":"","yearsExperienceMin":2,"yearsExperienceMax":null,"id":"3907445","isBookmarked":false},"JobListingSearchResult:4791976":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Senzcraft** \nSenzcraft, founded by IIM Bangalore and IEST Shibpur Alumni, Senzcraft is a niche AI C \nAutomation company. Senzcraft vision is to Radically Simplify Today's Work with AI And design \nBusiness Process for the Future using AI C intelligent process automation technologies. At \nSenzcraft, we help enterprises unlock value through AI, automation, and intelligent data platforms. \n\nWe have a suite of SaaS products and services, partnering with automation product companies. \nFor more details: \nPlease visit our website - https://www.senzcraft.com \nOur Intelligent Document Processing SaaS platform – https://www.doqumate.com Our AI \nOperations SaaS platform – https://MagicOps.ai \nSenzcraft on LinkedIn - https://www.linkedin.com/company/senzcraft \n\n**Role Overview **\n\nWe are looking for an experienced Senior AI/ML Engineer to design, develop, and deploy \nproduction-grade AI/ML solutions across forecasting, recommendation systems, generative AI, and \nintelligent agent applications. The ideal candidate will have strong hands-on expertise in machine \nlearning, deep learning, modern GenAI technologies, and cloud-native AI architectures**. \n\nLocation: Bengaluru (Hybrid) \nExperience: 7+ Yrs \n\n**Key Responsibilities **\n\n• Design, develop, and deploy end-to-end AI/ML solutions aligned with business objectives. \n• Build and optimize forecasting and recommendation systems using advanced machine \nlearning techniques. \n• Develop solutions using deep learning, neural networks, and reinforcement learning. \n• Work with Generative AI, Large Language Models (LLMs), RAG, AI agents, and vector \ndatabases. \n• Select and implement appropriate algorithms based on business objectives, data \ncharacteristics, scalability, and performance requirements. \n• Develop and productionize machine learning models using Python and modern AI/ML \nframeworks. \n• Design and implement AI-powered applications using frameworks such as PyTorch, \nTensorFlow, LangChain, Semantic Kernel, and related technologies. \n• Build scalable AI/ML solutions using Azure AI services, AWS AI/ML services, and cloud\nnative architectures. \n• Implement MLOps practices covering model development, deployment, monitoring, \nversioning, and lifecycle management. \n• Containerize and deploy ML/AI workloads using Docker and Kubernetes. \n• Apply supervised and unsupervised learning techniques to solve complex business \nproblems. \n• Collaborate with data engineers, software engineers, product teams, and business \nstakeholders to translate requirements into scalable AI solutions. \n• Evaluate model performance and continuously improve accuracy, reliability, scalability, and \ncost efficiency. \n\n**Required Skills and Qualification **\n\n• Bachelor's or Master's degree in Computer Science, Data Science, Artificial Intelligence, \nMachine Learning, or a related field. \n• 7+ years of experience in AI/ML engineering, software engineering, data engineering, or \ncloud-based development. \n• Strong hands-on experience with Python and production machine learning systems. \n• Strong foundation in statistics, predictive modeling, and machine learning. \n• Experience selecting and implementing algorithms based on business objectives, data \ncharacteristics, and performance requirements. \n• Strong experience with Generative AI, LLMs, RAG architectures, AI agents, and vector \ndatabases. \n• Practical experience with AI/ML frameworks such as PyTorch, TensorFlow, LangChain, and \nSemantic Kernel. \n• Experience with Azure AI services and/or AWS AI/ML services. \n• Strong understanding of MLOps, CI/CD, model deployment, monitoring, and cloud-native \narchitectures. \n• Knowledge of Docker and Kubernetes.","jobType":"full-time","liveStartAt":1790875555,"locationNames":["Bengaluru"],"primaryRoleTitle":"Machine Learning Engineer","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"senior-ai-ml-engineer-7-years-of-experience-bangalore-location-immediate-to-30-days-joiners","title":"Senior AI/ML Engineer | 7+ Years of experience| Bangalore Location| Immediate to 30 Days joiners","compensation":"₹2,000 – ₹30L • No equity","yearsExperienceMin":7,"yearsExperienceMax":null,"id":"4791976","isBookmarked":false},"JobListingSearchResult:4546280":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About Senzcraft: **\n\nFounded by IIM Bangalore and IEST Shibpur Alumni, Senzcraft is a hyper-automation company. Senzcraft vision is to Radically Simplify Today's Work. And Design Business Process For The Future. Using intelligent process automation technologies.\n\nWe have a suite of SaaS products and services, partnering with automation product companies.\n\nPlease visit our website - https://www.senzcraft.com for more details\n\nOur AI Operations SaaS platform – https://MagicOps.ai\n\nSenzcraft on linkedin -\u0026gt; https://www.linkedin.com/company/senzcraft\n\nSenzcraft is awarded by Analytics India Magazine in it’s report “State of AI in India” as a “Niche AI startup”. Senzcraft is also recognized by NY based SSON as a top hyper-automation solutions provider.\n\n**About the Role**\nSenzcraft is looking for an experienced AI Engineer to build and deploy intelligent AI solutions powered by Generative AI, LLMs, Agentic AI, and Machine Learning. You will work on cutting-edge AI applications, collaborating with cross-functional teams to deliver scalable, production-ready solutions for enterprise clients.\n\n**Key Responsibilities**\n* Design, develop, and deploy AI-powered applications using LLMs and Generative AI.\n* Build RAG (Retrieval-Augmented Generation) pipelines for enterprise use cases.\n* Develop AI Agents and multi-agent workflows using frameworks like LangChain, LangGraph, or LlamaIndex.\n* Fine-tune, evaluate, and optimize AI/ML models for performance and scalability.\n* Integrate AI models with business applications using APIs and microservices.\n* Develop prompt engineering strategies and optimize LLM responses.\n* Work with vector databases and semantic search solutions.\n* Deploy AI applications on cloud platforms and monitor production performance.\n* Collaborate with Data Scientists, Data Engineers, and Product teams to deliver end-to-end AI solutions.\n\n**Required Skills**\n* 5–7 years of experience in AI/ML Engineering or related roles.\n* Strong programming skills in Python.\n* Hands-on experience with Large Language Models (LLMs) and Generative AI.\n* Experience with OpenAI, Azure OpenAI, Anthropic Claude, Gemini, or Llama models.\n* Strong knowledge of RAG, Embeddings, Vector Search, and Semantic Search.\n* Experience with LangChain, LangGraph, LlamaIndex, or similar AI orchestration frameworks.\n* Hands-on experience with Prompt Engineering, Function Calling, and AI Agent development.\n* Experience with Vector Databases such as Pinecone, FAISS, Weaviate, ChromaDB, or Milvus.\n* Good understanding of Machine Learning and Deep Learning concepts.\n* Experience with TensorFlow, PyTorch, or Hugging Face Transformers.\n* Strong knowledge of REST APIs, FastAPI, and microservices architecture.\n* Experience with Git, Docker, and Kubernetes.\n* Hands-on experience with AWS, Azure, or GCP.","jobType":"full-time","liveStartAt":1785863589,"locationNames":["Bengaluru","Bangalore Urban"],"primaryRoleTitle":"Software Engineer","remote":false,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"ONSITE","wfhFlexible":true},"acceptedRemoteLocationNames":[],"slug":"ai-engineer-5-8-years-bangalore-immediate-joiners-peferred","title":"AI Engineer| 5-8 Years| Bangalore| Immediate Joiners peferred","compensation":"₹25L – ₹32L • No equity","yearsExperienceMin":5,"yearsExperienceMax":null,"id":"4546280","isBookmarked":false},"StartupResult:5889172":{"__typename":"StartupResult","id":"5889172","badges":[{"__ref":"Badge:B2B-5889172"},{"__ref":"Badge:COMPANY_STAGE-5889172"}],"companySize":"SIZE_11_50","highConcept":"Simplify Your Work. Using Intelligent Process Automation","highlightedJobListings":[{"__ref":"JobListingSearchResult:3907445"},{"__ref":"JobListingSearchResult:4791976"},{"__ref":"JobListingSearchResult:4546280"}],"logoUrl":"https://photos.wellfound.com/startups/i/5889172-94acb55789617aa2fa83e37032d1fcf3-medium_jpg.jpg?buster=1529114798","name":"senzcraft technologies","slug":"senzcraft-technologies"},"Badge:B2B-11045140":{"__typename":"Badge","id":"B2B-11045140","name":"B2B_BADGE","label":"B2B","tooltip":null,"avatarUrl":null,"rating":null,"data":null},"JobListingSearchResult:5135399":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"**About FractionAI**\nFractionAI helps organizations unlock real value from AI, not through hype, but through pragmatic, ROI-driven solutions that work in production. We partner with businesses across industries to design, build, and operationalize AI systems that solve tangible problems and deliver measurable outcomes.\n\n**About the Role**\nWe are looking for a 100x AI Deployment Specialist who combines deep technical fluency across the full AI spectrum with sharp business intuition. This is not a research role, it is a hands-on, delivery-oriented position where you will architect, build, and ship production-grade AI solutions that drive real ROI for our clients.\n\nYou will work directly with stakeholders to understand business context, identify high-impact opportunities, and translate them into robust, scalable AI systems. The ideal candidate is equally comfortable discussing business strategy with a C-suite executive and writing production Python code at 2 AM.\n\nPay: INR 12-15 lacs per annum\nHours: 7.30PM to 3.30AM IST (US hours)\nLocation: Remote\n\n**What You Will Do**\n* Design \u0026amp; Deliver AI Solutions: Scope, architect, and build end-to-end AI solutions spanning Business Intelligence, RPA, ML/Predictive Analytics, and Generative AI, always with a production-first, ROI-first mindset.\n* Build Agentic Workflows: Design and implement autonomous, multi-step AI agent workflows using tools like n8n, LangChain, LangGraph, CrewAI, and similar agentic orchestration frameworks.\n* Engineer Robust Data Pipelines: Stand up and maintain sound data engineering practices, from ingestion and transformation to storage and serving, across major cloud platforms (AWS, GCP, Azure).\n* Operationalize ML Models: Own the full MLOps lifecycle: data preparation, feature engineering, model training, evaluation, deployment, monitoring, and retraining.\n* Drive Data Quality: Enforce rigorous data science and data cleanliness standards, ensuring that every solution is built on a foundation of trustworthy, well-governed data.\n* Engage with Clients: Translate complex technical capabilities into clear business value; work closely with clients to understand their domain, pain points, and success metrics.\n\n\n**Required Qualifications**\n* Business-First Thinking: Ability to understand business context, identify where AI can create the highest leverage, and deliver solutions that are measured by ROI, not novelty.\n* Deep, Broad AI Expertise: 3-5 years of proven, hands-on experience across the AI spectrum: Business Intelligence, Robotic Process Automation, Machine Learning / Predictive Analytics, and Generative AI. You understand these domains deeply, not just at a surface level.\n* Agentic Workflow Proficiency: Demonstrated experience building agentic, multi-step AI workflows using orchestration tools such as n8n, Make, Zapier (for RPA), as well as agent frameworks like LangChain, LangGraph, AutoGen, or CrewAI. Candidate must be able to quickly understand AI features in SaaS applications and operationalize them effectively. \n* Advanced Python Development: Expert-level Python skills with deep familiarity with AI/ML frameworks (LangChain, LangGraph, Hugging Face, scikit-learn, PyTorch/TensorFlow) and production software engineering best practices.\n* Data Engineering Competence: Strong knowledge of cloud data infrastructure (AWS, GCP, Azure), data warehousing, ETL/ELT pipelines, and the trade-offs between different architectural choices.\n* Data Science \u0026amp; MLOps Excellence: Deep expertise in data science workflows, data cleanliness, feature engineering, model evaluation, and the operational discipline of MLOps (CI/CD for ML, monitoring, drift detection, retraining pipelines).\n\n**Preferred Qualifications**\n* Experience with educational institutions is a MAJOR plus\n* Experience in a client-facing setting\n* Experience working with early-stage or fast-moving teams where speed, ownership, and adaptability are critical.\n* Contributions to open-source AI/ML projects or a strong public portfolio of technical work.\n* Familiarity with vector databases (Pinecone, Weaviate, Chroma), RAG architectures, and fine-tuning LLMs.","jobType":"full-time","liveStartAt":1795443503,"locationNames":["Bengaluru","Delhi","Gurgaon","Pune","Hyderabad","Chandigarh","Mumbai","Kolkata","Chennai"],"primaryRoleTitle":"Full-Stack Engineer","remote":true,"remoteConfig":{"__typename":"JobListingRemoteConfig","kind":"REMOTE","wfhFlexible":false},"acceptedRemoteLocationNames":[],"slug":"ai-deployment-specialist-ds-de-swe-clone","title":"AI Deployment Specialist (DS, DE \u0026 SWE)","compensation":"₹16L – ₹20L • No equity","yearsExperienceMin":3,"yearsExperienceMax":null,"id":"5135399","isBookmarked":false},"StartupResult:11045140":{"__typename":"StartupResult","id":"11045140","badges":[{"__ref":"Badge:ACTIVELY_HIRING"},{"__ref":"Badge:B2B-11045140"}],"companySize":"SIZE_11_50","highConcept":"A data consulting firm that embeds AI experts into clients to own AI implementation","highlightedJobListings":[{"__ref":"JobListingSearchResult:5135399"}],"logoUrl":"https://photos.wellfound.com/startups/i/11045140-bf9d6d364c2d2c1f49b0270fb4a2b878-medium_jpg.jpg?buster=1781144588","name":"FractionAI","slug":"fractionai"},"JobListingSearchResult:5126327":{"__typename":"JobListingSearchResult","autoPosted":false,"atsSource":null,"description":"### AI Programmer / AI Engineer\n**Experience:** 3–4 Years  \n**Employment Type:** Full-time\n\n**About the Role**\n\nWe are seeking an experienced AI Programmer with 3–4 years of hands-on experience in designing, developing and deploying AI-driven applications. as utilise the most advanced applications of Computer Vision and AI in their everyday lives using its app-oriented open and unified Operating System model. With a stellar team of researchers and engineers, our constant endeavour is to push the boundaries of technology while delivering great value to our customers. Awiros is a complex technology platform with a highly dynamic development, deployment, and troubleshooting approach. \nThe core engineering of Awiros includes real-time deep-learning-based video/image inference, distributed processing, high-throughput data handling, and state-of-the-art tools/frameworks like Deep Learning, Computer Vision, TensorFlow, Kubernetes, Kafka, and Elastic Search. Our mission is to bring the power of Computer Vision to everyone, right from developers to end users. Awiros is the conduit to bring the most cutting-edge research in the areas of Computer Vision, Deep Learning, and Artificial Intelligence to the market.\n\n**ABOUT THE ROLE:**\nWe are looking for a Computer Vision Engineer to assist us in building advanced level Computer Vision solutions using cutting edge devices. You will become an integral part of the team, making every problem of the platform a problem of your own, and solving them accordingly. \n\n**RESPONSIBILITIES:** \n* Research, analyze, and define business solutions including detailed project specifications and design solutions for business problems \n* Document test cases, expected results, test data requirements, and collaborate with testing teams/business partners to resolve testing problems \n* Provide impact analysis for changes to programs and systems \n* Assist in the definition of team processes and strategies and serve as technical resource on the team \n* Working on understanding and improving key vision libraries \n* Helping to develop state of the art vision algorithms \n* Helping to take algorithms developed by other teams and develop them into products \n* Research on state-of-the-art recognition ingSearchResult","autoPosted":false,"atsSource":null,"description":"**Designation: Android Multimedia Engineer – Audio | Video | Camera\nLocation: Bangalore\nExperience: 3+ Years**\n\nLove building what people see and hear on their devices?\nJoin us to work at the heart of the Android Multimedia stack, where your code brings cameras to life,\nmakes audio sound right, and powers seamless video streaming on real devices. If you enjoy working\nclose to the hardware and solving deep system-level problems, this role is for you.\n\n**What You’ll Work On**\n*  Camera bring-up and audio bring-up on Android platforms\n*  Camera HAL, Camera2 API, and camera tuning\n*  Multimedia frameworks and components including Stagefright, OMX, AudioFlinger, Audio HAL,\n* ALSA framework, and V4L2\n*  Streaming protocols such as RTP and RTSP, along with Wi-Fi Display\n*  The end-to-end Android Multimedia framework across audio, video, and camera\n\n**What You Bring**\n*  Strong programming skills in C and C++, with a solid grasp of data structures and algorithms\n*  Good working knowledge of Java\n*  Hands-on experience with the Android operating system and the Android Multimedia framework\n*  A genuine interest in building a career in the Android Multimedia domain\n*  Prior multimedia experience is a big plus\n\n**Bonus Points If You Have**\n*  Knowledge of Python, R, or TensorFlow\n*  Exposure to neural networks, AI, and machine learning\n*  Understanding of DSP and audio/video codecs\n\n**Why This Role Stands Out**\n*  Work on the full multimedia stack, from low-level drivers and HAL up to the framework\n*  Gain hands-on exposure to real device bring-up, a skill set that’s in high demand\n*  Opportunity to explore the growing intersection of multimedia and AI/ML\n*  Grow your expertise alongside experienced engineers in a fast-moving domain","jobType":"full-time","liveStartAt":1791965169,"locationNames":["Bengaluru"],"primaryRoleTitle":"Android Developer","remote":false  cross-functional teams to deliver scalable AI-driven solutions.\n* Monitor model performance, troubleshoot production issues, and maintain technical documentation.\n\n**Required Skills\nMandatory**\n* 1–3 years of experience in AI/ML development.\n* Strong programming skills in Python and SQL.\n* Hands-on experience with Machine Learning frameworks such as PyTorch, TensorFlow, or Scikit-learn.\n* Experience building LLM-powered applications using RAG, Prompt Engineering, and Embeddings.\n* Hands-on experience with LangChain, LlamaIndex, CrewAI, or n8n for LLM orchestration and AI workflow automation.\n* Experience in LLM fine-tuning and working with Hugging Face models.\n* Knowledge of MLOps concepts including model deployment, monitoring, versioning, and CI/CD.\n* Experience with Git, REST APIs, Linux environments, and data processing libraries.\n\n**Preferred**\n* Experience with vector databases such as Pinecone, Chroma, Milvus, or Weaviate.\n* Familiarity with Docker, Kubernetes, and MLflow.\n* Exposure to Apache Spark or Airflow for data engineering workflows.\n* Experience with cloud platforms (AWS, Azure, or GCP).\n\n**Primary Technology Stack**\n* Languages and Data Processing: Python, SQL, Pandas, NumPy, Apache Spark\n* Tech Stack: MERN - React.js, Node.js\n* AI \u0026amp; Machine Learning: PyTorch, TensorFlow, Scikit-learn\n* Application Frameworks: LangChain, LlamaIndex, CrewAI, n8n\n* Core Methodologies: Retrieval-Augmented Generation (RAG), Model Fine-Tuning, Prompt Engineering, Embeddings\n* Models \u0026amp; Infrastructure: OpenAI APIs, Hugging Face Ecosystem, Embedding Models\n* Vector Databases: Pinecone, Chroma, Milvus, Weaviate\n* Databases: PostgreSQL, MongoDB\n* MLOps \u0026amp; DevOps: Docker, Kubernetes, MLflow, CI/CD, Git\n* Cloud Platforms: AWS, Azure, GCP\n\n**Experience:** 1–3 Years\n**Domain:** Data Science | Data Engineering | Machine Learning | Generative AI | MLOps","jobType":"full-time","liveStartAt":1786108114,"locationNames":["Beng
