<script>  // steps as on the live site: Next moves on only when the step is complete; the resume step has no
          // <input type=file> until you press "Upload resume", which opens the file picker.
const ea = document.getElementById('ea');
let step = 1, chosen = '';
ea.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.viewName === 'upload-document-unify') {
    const f = document.createElement('input'); f.type = 'file'; f.accept = '.pdf,.doc,.docx';
    f.onchange = () => { chosen = f.files[0].name;
      document.getElementById('easyApplyUploadedResumeRef').innerHTML =
        '<label><input type="radio" name="resume" checked aria-checked="true"> ' + chosen + '</label>'; };
    f.click();
  } else if (b.dataset.viewName === 'continue-unify') {
    if (step === 1) { ea.dataset.tel = ea.querySelector('input[type=tel]').value; ea.innerHTML = document.getElementById('s2').innerHTML; step = 2; }
    else if (step === 2 && chosen) { ea.innerHTML = '<h2>Review your application</h2><p>Resume: ' + chosen +
      '</p><button type="button" aria-label="Submit application">Submit application</button>'; step = 3; }
  }
});
</script>
