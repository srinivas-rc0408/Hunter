<!doctype html><html><head><meta charset="utf-8"><title>Apply · ML Intern · Acme (Greenhouse-style)</title></head><body>
<h1>Machine Learning Intern</h1>
<form id="application_form" onsubmit="event.preventDefault(); document.body.innerHTML='<h2>Thank you for applying!</h2>';">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" type="email" required></div>
  <div class="field"><label for="phone">Phone *</label><input id="phone" type="tel" required></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" type="file" required></div>
  <div class="field"><label for="li">LinkedIn Profile</label><input id="li"></div>
  <div class="field"><label for="gh">GitHub URL</label><input id="gh"></div>
  <div class="field"><label for="dob">Date of Birth *</label><input id="dob" placeholder="DD/MM/YYYY" required></div>
  <div class="field"><label for="fn">Father's Name *</label><input id="fn" required></div>
  <div class="field"><label for="mn">Mother's Name *</label><input id="mn" required></div>
  <div class="field"><label for="deg">Degree *</label><select id="deg" required><option>Select</option><option>B.E./B.Tech</option><option>M.Tech</option></select></div>
  <div class="field"><label for="gy">Year of Graduation *</label><select id="gy" required><option value="">--</option><option>2026</option><option>2027</option></select></div>
  <div class="field"><label for="cg">CGPA *</label><input id="cg" required></div>
  <fieldset><legend>Are you willing to relocate? *</legend>
    <label><input type="radio" name="reloc" value="y" required> Yes</label><label><input type="radio" name="reloc" value="n"> No</label></fieldset>
  <fieldset><legend>Do you have any active backlogs? *</legend>
    <label><input type="radio" name="bk" value="y" required> Yes</label><label><input type="radio" name="bk" value="n"> No</label></fieldset>
  <div class="field"><label for="why">Anything else you'd like to share?</label><textarea id="why"></textarea></div>
  <div class="field"><label><input type="checkbox" id="gdpr" required> I agree to the privacy policy *</label></div>
  <div class="field"><label><input type="checkbox" id="news"> Keep me updated about future opportunities</label></div>
  <button type="submit">Submit application</button>
</form></body></html>
