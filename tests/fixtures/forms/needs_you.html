<!doctype html><html><head><meta charset="utf-8"><title>Apply · Data Scientist</title></head><body>
<form onsubmit="event.preventDefault(); document.body.innerHTML='<h2>Application received</h2>';">
  <label for="name">Full Name *</label><input id="name" required>
  <label for="em">Email address *</label><input id="em" type="email" required>
  <label for="ctc">Expected CTC (LPA) *</label><input id="ctc" required>
  <label for="why">Why do you want to join us? *</label><textarea id="why" required></textarea>
  <label for="yrs">How many years of experience do you have with Kubernetes? *</label><input id="yrs" required>
  <button type="submit">Submit</button>
</form></body></html>
